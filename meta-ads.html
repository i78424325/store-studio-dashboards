function allocate(total,weights,precision=1){
 const units=Math.round(total*precision),sum=weights.reduce((n,w)=>n+w,0);
 let cumulative=0,previous=0;
 return weights.map(w=>{cumulative+=w;const current=Math.round(units*cumulative/sum),part=(current-previous)/precision;previous=current;return part});
}
function campaignTemplate(original,index){
 const weights=Array.from({length:60},(_,n)=>((n*31+index*17)%67)+9);
 const allocation={};
 const vary=(n,salt)=>.55+((n*salt+17*index)%53)/48;
 allocation.impressions=allocate(original.impressions,weights);
 allocation.reach=allocate(original.reach,weights.map((w,n)=>w*(.85+.2*vary(n,19))));
 allocation.spend=allocate(original.spend,weights.map((w,n)=>w*vary(n,41)),100);
 allocation.clicks=allocate(original.clicks,weights.map((w,n)=>w*vary(n,23)));
 allocation.purchases=allocate(original.purchases,allocation.clicks.map((clicks,n)=>n%7===3?0:clicks*vary(n,13)));
 allocation.value=allocate(original.value,allocation.purchases.map((count,n)=>count*vary(n,29)),100);
 const budgets=allocate(original.budget,[5,3,2],100);
 return weights.map((_,n)=>{
  const set=Math.floor(n/20),slot=n%20,angle=concepts[index][Math.floor(slot/4)];
  const row={...original,id:n===0?original.id:original.id+'-'+(set+1)+'-'+(slot+1),sid:set===0?original.sid:original.sid+'-'+(set+1),s:seedSets[index][set],
   a:n===0?original.a:defaultCreatives[slot].title+' | '+angle+' · '+formats[slot%4]+' '+['A','B','C'][set],active:original.active&&(n===0||n%6!==0),budget:budgets[set],visual:n+60*index};
  for(const field of fieldsOf)row[field]=allocation[field][n];
  return row;
 });
}
function loadHierarchy(saved){
 if(saved?.schemaVersion>=2)return saved;
 const model=saved?structuredClone(saved):{...base,rows:[]};
 for(const [index,original] of defaults.rows.entries()){
  const template=campaignTemplate(original,index),existing=model.rows.filter(r=>r.cid===original.cid);
  if(!existing.length){if(!saved)model.rows.push(...template);continue}
  const untouched=existing.length===1&&Object.keys(original).every(k=>existing[0][k]===original[k])&&!existing[0].daily?.length&&!existing[0].thumbnailKey;
  if(untouched){model.rows.splice(model.rows.indexOf(existing[0]),1,...template);continue}
  // Keep all custom records, including their metrics, daily rows and original identifiers.
  const existingIds=new Set(model.rows.map(r=>r.id));
  for(const row of template){
   if(existingIds.has(row.id))continue;
   const siblings=model.rows.filter(r=>r.sid===row.sid);
   if(siblings.length>=20)continue;
   row.c=existing[0].c;if(siblings.length)row.s=siblings[0].s;
   row.budget=siblings[0]?.budget||0;row.active=false;
   for(const field of fieldsOf)row[field]=0;
   model.rows.push(row);existingIds.add(row.id)
  }
 }
 model.schemaVersion=2;return model
}

phoneSettings.innerHTML=icon('gear');phoneSettings.onclick=settingsBtn.onclick=accountBtn.onclick=()=>openEditor();phoneSelect.onclick=()=>{phoneSelecting=!phoneSelecting;if(!phoneSelecting)selected.clear();render()};createBtn.innerHTML=icon('plus')+'Create';createBtn.onclick=()=>openEditor('create');dupBtn.innerHTML=icon('copy')+'Duplicate';dupBtn.onclick=duplicate;editBtn.innerHTML=icon('edit')+'Edit';editBtn.onclick=()=>openEditor(level===2?'ad':'settings',groups().find(g=>selected.has(g.id)).items[0].id);searchLabel.insertAdjacentHTML('afterbegin',icon('search'));query.oninput=()=>{selected.clear();render()};refresh.innerHTML=icon('refresh');refresh.onclick=render;columnsBtn.onclick=()=>{picker.hidden=true;colMenu.hidden=!colMenu.hidden;colMenu.innerHTML=Object.keys(presetsCols).map(s=>'<button class="'+(s===columnMode?'on':'')+'">'+s+'</button>').join('');colMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>{columnMode=b.textContent;colMenu.hidden=true;render()})};
exportBtn.innerHTML=icon('export')+'Export';exportBtn.onclick=()=>{const cols=presetsCols[columnMode];const rows=[[singular[level],'Delivery',...cols.map(k=>metrics[k][0])],...groups().map(g=>[g.name,g.active?'Active':'Off',...cols.map(k=>metrics[k][1](g))])];const csv=rows.map(row=>row.map(s=>'"'+String(s).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Ads Manager '+names[level]+' '+selectedRange.start+' - '+selectedRange.end+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.date'))picker.hidden=true;if(!e.target.closest('.columns'))colMenu.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){picker.hidden=true;colMenu.hidden=true}});render();
</script></body></html>
